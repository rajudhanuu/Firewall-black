
name: Build Firewall.black APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project
        run: |
          unzip -o Firewall.black-starter.zip -d starter
          find starter -name settings.gradle.kts

      - name: Fix Java and Kotlin targets
        run: |
          FILE=$(find starter -path '*/app/build.gradle.kts' | head -n 1)
          cat >> "$FILE" <<'EOF'

android {
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}
EOF

      - name: Build debug APK
        run: |
          PROJECT_DIR=$(dirname "$(find starter -name settings.gradle.kts | head -n 1)")
          cd "$PROJECT_DIR"
          gradle assembleDebug


      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Firewall-black-debug-apk
          path: starter/**/app/build/outputs/apk/debug/*.apk
